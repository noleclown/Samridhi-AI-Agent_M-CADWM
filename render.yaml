services:
  - type: web
    name: samridhi-ai
    runtime: python
    buildCommand: pip install -r requirements_server.txt
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false          # you set this manually in Render dashboard
      - key: ALLOWED_ORIGINS
        value: "*"
