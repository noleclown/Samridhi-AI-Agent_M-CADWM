services:
  - type: web
    name: samridhi-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements_server.txt
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PORT
        value: "10000"
